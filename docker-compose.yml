services:
  postgres:
    image: postgres
    env_file:
      - .env/.env.development
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devsearch
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  devsearch:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: devsearch
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
    ports:
      - 8000:8000
    volumes:
      - ./.env:/app/.env
      - ./api:/app/api
      - ./devsearchproject:/app/devsearchproject
      - ./projects:/app/projects
      - ./static:/app/static
      - ./templates:/app/templates
      - ./users:/app/users
    command: >
      sh -c "python3 manage.py collectstatic --noinput &&
             python3 manage.py makemigrations &&
             python3 manage.py migrate &&
             python3 manage.py runserver 0.0.0.0:8000"